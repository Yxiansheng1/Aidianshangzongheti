<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>AI 电商综合体 · 本地客户端</title>
    <style>
      :root {
        --bg: #11151c;
        --card: #1a212c;
        --line: #2a3441;
        --text: #e6edf3;
        --muted: #8b98a9;
        --ok: #3fb950;
        --warn: #d29922;
        --bad: #f85149;
        --busy: #58a6ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      }
      .card {
        width: 520px;
        padding: 32px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      .sub {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 13px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #141a23;
        margin-bottom: 12px;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        flex: 0 0 auto;
        background: var(--muted);
      }
      .dot.connected {
        background: var(--ok);
        box-shadow: 0 0 0 4px rgba(63, 185, 80, 0.16);
      }
      .dot.disconnected {
        background: var(--bad);
        box-shadow: 0 0 0 4px rgba(248, 81, 73, 0.16);
      }
      .dot.starting {
        background: var(--busy);
        animation: pulse 1.1s ease-in-out infinite;
      }
      .dot.stopped {
        background: var(--warn);
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      .label {
        font-weight: 600;
        font-size: 15px;
      }
      .detail {
        margin-left: auto;
        color: var(--muted);
        font-size: 12px;
        text-align: right;
        max-width: 60%;
        word-break: break-all;
      }
      button {
        margin-top: 8px;
        padding: 9px 18px;
        font-size: 14px;
        color: var(--text);
        background: #212b38;
        border: 1px solid var(--line);
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        background: #2a3644;
      }
      pre {
        margin: 20px 0 0;
        padding: 14px;
        max-height: 220px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #0d1117;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      .hint {
        margin-top: 14px;
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>后端状态</h1>
      <p class="sub">pipeline.api · 127.0.0.1:8765</p>

      <div class="row">
        <span id="dot" class="dot starting"></span>
        <span id="label" class="label">正在启动…</span>
        <span id="detail" class="detail">等待后端…</span>
      </div>

      <button id="probe">立即探活</button>

      <pre id="raw">—</pre>

      <p class="hint">
        杀掉 Python 进程（<code>taskkill /PID &lt;pid&gt; /T /F</code>）后，本页会在几秒内变成"后端断开"。
      </p>
    </main>

    <script>
      const dot = document.getElementById("dot");
      const label = document.getElementById("label");
      const detail = document.getElementById("detail");
      const raw = document.getElementById("raw");

      const TEXT = {
        connected: "后端已连接",
        disconnected: "后端断开",
        starting: "正在启动…",
        stopped: "后端已关闭",
      };

      function render(status) {
        if (!status) return;
        dot.className = "dot " + status.state;
        label.textContent = TEXT[status.state] || status.state;
        detail.textContent = status.detail || "";
        raw.textContent = JSON.stringify(status, null, 2);
      }

      window.backend.getStatus().then(render);
      window.backend.onStatus(render);

      document.getElementById("probe").addEventListener("click", async () => {
        const res = await window.backend.probe();
        raw.textContent = JSON.stringify(res, null, 2);
      });
    </script>
  </body>
</html>
