# 复制为 config.toml 后填写。config.toml 已被 .gitignore 忽略，不会进仓库。

[model]
# 第一阶段可以直接填供应商官方地址；第二阶段换成 one-api 的本地地址即可，业务代码不用改。
base_url = "https://api.deepseek.com"
# 把真实 key 粘在下面引号里。留空或含中文会跳过模型测试（不会报错）。
api_key = ""
# 文本模型：用于润色标题、正文、标签
text_model = "deepseek-chat"
# 图像模型：必须支持「参考图输入」，否则做不了商品图
image_model = ""

[mxpage]
# MxPage 导出目录。约定：一个商品一个子文件夹，文件夹名 = 商品名
output_dir = "D:\\MxPage\\output"

[local]
# 本地 ComfyUI。不花钱，但慢——8GB 显存跑 20GB 模型要有耐心。
# 用之前先启动：D:\AI\ComfyUI_windows_portable\Start_Wan_8GB.bat
comfyui_url = "http://127.0.0.1:8188"
unet = "qwen-image-edit-2511-Q8_0.gguf"
clip = "qwen_2.5_vl_7b_fp8_scaled.safetensors"
vae = "qwen_image_vae.safetensors"
steps = 20
cfg = 2.5
shift = 3.1
width = 1024
height = 1024
# 单张最长等待秒数。8GB 显存首次加载模型可能要几分钟。
wait_timeout = 900

# --- 视频（Wan2.2 图生视频，双模型接力）---
wan_unet_high = "Wan2.2-I2V-A14B-HighNoise-Q4_K_M.gguf"
wan_unet_low = "Wan2.2-I2V-A14B-LowNoise-Q4_K_M.gguf"
wan_clip = "umt5_xxl_fp8_e4m3fn_scaled.safetensors"
wan_vae = "wan_2.1_vae.safetensors"
wan_clip_vision = "CLIP-ViT-H-14-laion2B-s32B-b79K.safetensors"
video_width = 480
video_height = 832
# 帧数必须是 4n+1：33≈2秒，49≈3秒，81≈5秒（16fps）
video_length = 33
video_fps = 16
video_steps = 20
video_cfg = 3.5
video_shift = 8.0
# 视频很慢，默认等 40 分钟
video_timeout = 2400

[publish]
# social-auto-upload 的启动命令。装好以后通常是 "sau"；
# 如果没装成全局命令，填完整路径，例如 "D:\\social-auto-upload\\.venv\\Scripts\\sau.exe"
sau_cmd = "sau"
# sau 的工作目录。它内部要 import conf，所以必须能在这里找到 conf.py
sau_cwd = "D:\\social-auto-upload"
# 默认发布目标
platforms = ["xiaohongshu", "zhihu"]
# true = 只打印计划不执行。建议一直保持 true 直到你确认参数正确
dry_run = true

# 知乎视频必填的「所属领域」，可选项见
# D:\social-auto-upload\uploader\zhihu_uploader\constants.py
zhihu_category = "家居生活"

[publish.accounts]
# 账号名是你在 `sau <平台> login --account 什么名字` 时自己起的，两边必须一致
xiaohongshu = "main"
douyin = "main"
zhihu = "main"

[orchestrate]# n8n 的 webhook 地址。工作台点「交给 n8n 全自动」时往这里 POST。
# 注意：改过工作流之后，必须在 n8n 里把工作流「停用→再启用」一次，
# 否则 webhook 不会重新注册，会返回 404。
webhook_url = "http://127.0.0.1:5678/webhook/ecom-gen-video"
