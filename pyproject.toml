[project]
name = "aidianshang"
version = "0.1.0"
description = "AI 综合体：内容生产 + 电商运营的本地工作台"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# 智能体运行时。装了这个才有 harness；不装也能跑纯规则测试。
harness = [
    "deepagents>=0.7.32,<0.8",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
